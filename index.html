<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css" type="text/css">
    <title>Rock Paper Scissors</title>
</head>
<body>

    <!-- USER INTERFACE OF THE ROCK PAPER SICISSORS GAME -->

    <!-- Heading of the Game -->

    <h1>Rock Paper Scissors Game</h1>

    <!-- Labels of the Buttons -->
    
    <div class="heading">
        <div>Rock</div>
        <div>Paper</div>
        <div>Scissors</div>
    </div>

    <!-- Buttons of the UI to play the RPS Game -->

    <div class="choices">
        <div class="choice" id="rock">
            <img src="./images/rock.jpg" alt="Rock">
        </div>
        <div class="choice" id="paper">
            <img src="./images/paper.jpg" alt="Paper">
        </div>
        <div class="choice" id="scissors">
            <img src="./images/scissors.jpg" alt="Scissors">
        </div>
    </div>

    <!-- Score Board of the Game -->

    <div class="score-board">
        <div class="score">
            <p id="human-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>

    <!-- Message Boards of the Game -->

    <div class="msg-container">
        <p id="msg">Play your Move</p>
    </div>

    <div class="message-cont">
        <p id="message">Result of the Game</p>
    </div>








    <script src="./js/javascript.js"></script>
</body>
</html>
